<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.15)}}@keyframes dashMove{0%{stroke-dashoffset:60}}@keyframes floatOrb{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-15px) translateX(10px)}}.node-text,.pill-text,.subtitle,.tagline,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#primaryGrad);letter-spacing:-.5px}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.tagline{font-weight:400;font-size:15px;fill:#38bdf8}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.node-text{font-weight:700;font-size:11px;fill:#38bdf8;text-anchor:middle}.orb-1,.orb-2{animation:floatOrb 8s ease-in-out infinite,pulseGlow 5s ease-in-out infinite alternate;transform-origin:center}.orb-2{animation:floatOrb 10s ease-in-out infinite reverse,pulseGlow 6s ease-in-out infinite alternate}.stream-line{stroke-dasharray:6 8;animation:dashMove 2.5s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><circle cx="200" cy="100" r="140" fill="#38bdf8" class="orb-1" filter="url(#glow)" opacity=".12"/><circle cx="1020" cy="300" r="160" fill="#818cf8" class="orb-2" filter="url(#glow)" opacity=".12"/><circle cx="620" cy="380" r="120" fill="#c084fc" class="orb-1" filter="url(#glow)" opacity=".08"/><g opacity=".6"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 80,360 C 260,330 400,380 600,340 S 950,370 1120,330" class="stream-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 120,50 C 350,110 500,40 780,90 S 1000,30 1100,80" class="stream-line"/><path fill="none" stroke="#06b6d4" stroke-width="1.8" d="M 900,120 C 960,180 920,240 1060,280" class="stream-line"/></g><rect width="1150" height="370" x="25" y="25" fill="none" stroke="#334155" stroke-opacity=".4" stroke-width="1.5" rx="16"/><g><g transform="translate(60, 60) translate(0, 15)"><rect width="270" height="30" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="15"/><circle cx="16" cy="15" r="5" fill="#38bdf8" filter="url(#glow)"/><text x="32" y="20" class="tagline">⚡ NEXT-GEN DEPLOYMENTS</text></g><text x="0" y="95" class="title" transform="translate(60, 60)">Cloud Orchestration &amp; Serverless</text><text x="0" y="140" class="subtitle" transform="translate(60, 60)">Curated directory of container schedulers, serverless runtimes, and PaaS architectures</text><g><g transform="translate(60, 60) translate(0, 185) translate(0, 0)"><rect width="135" height="36" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" rx="18"/><text x="